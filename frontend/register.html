<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Join PawsitiveWalks - Register as a Dog Walker or Owner</title>
    <meta
      name="description"
      content="Create your PawsitiveWalks account today. Sign up to find reliable dog walkers or start your career as a professional pet sitter."
    />
    <meta
      name="keywords"
      content="sign up, create account, register, dog walking job, find pet sitter"
    />
    <meta name="author" content="Yi-Peng Chiang" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="PawsitiveWalks - Connect with Trusted Dog Walkers"
    />
    <meta
      property="og:description"
      content="PawsitiveWalks is a platform connecting dog owners with trusted dog walkers. It is a zero-fee community platform connecting dog owners with trusted walkers. A simple bridge for direct connection and negotiation."
    />
    <meta
      property="og:url"
      content="https://dog-walker-project.onrender.com/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="PawsitiveWalks" />
    <meta property="og:image" content="./images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://dog-walker-project.onrender.com/" />

    <!-- Favicon Meta Tags -->
    <link rel="icon" type="image/png" href="./images/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./css/register.css" />
  </head>

  <body class="login-page">
    <div class="container login-page-wrap">
      <a class="login-brand-link" href="/">
        <span>🐕</span>
        <span>PawsitiveWalks</span>
      </a>
      <div class="login-card">
        <div class="login-header">
          <h1>Create Account</h1>
          <p>Join the PawsitiveWalks family</p>
        </div>

        <div id="error-message" class="error-box d-none" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="reg-name">Full Name</label>
            <input
              type="text"
              id="reg-name"
              class="form-control"
              placeholder="Alex Chen"
              autocomplete="name"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="reg-email">Email</label>
            <input
              type="email"
              id="reg-email"
              class="form-control"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="reg-password">Password</label>
            <div class="input-group">
              <input
                type="password"
                id="reg-password"
                class="form-control"
                placeholder="Min. 8 characters"
                autocomplete="new-password"
                required
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="togglePassword"
              >
                👁️
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="reg-confirm-password"
              >Confirm Password</label
            >
            <div class="input-group">
              <input
                type="password"
                id="reg-confirm-password"
                class="form-control"
                placeholder="Repeat your password"
                autocomplete="new-password"
                required
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="toggleConfirmPassword"
              >
                👁️
              </button>
            </div>
            <div id="password-status" class="mt-1 small d-none">
              <span id="status-icon"></span>
              <span id="status-text"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100">
            Sign Up
          </button>
        </form>

        <p class="switch-auth mt-3 mb-0">
          Already have an account? <a href="/login.html">Login</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/registerModule.js"></script>
  </body>
</html>
